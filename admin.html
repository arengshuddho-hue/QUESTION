<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | CSE-57 Section C</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Login Screen -->
<div class="container" id="loginScreen">
  <h2 style="color: var(--gold);"><i class="fa-solid fa-shield-halved"></i> Secure Admin Login</h2>
  <div class="form-group">
    <input type="email" id="adminEmail" placeholder="Enter Admin Email" style="margin-bottom: 15px;">
    <input type="password" id="password" placeholder="Enter Admin Password">
  </div>
  <button class="btn" onclick="login()" style="width: 100%;">Secure Login</button>
  <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Authenticating...</div>
</div>

<!-- Admin Dashboard -->
<div class="container" id="adminScreen" style="display:none;">
  <div class="header">
    <h1><i class="fa-solid fa-gear"></i> Admin Dashboard</h1>
    <div>
      <a href="index.html" target="_blank" class="btn" style="margin-right: 10px;"><i class="fa-solid fa-eye"></i> View Portal</a>
      <button class="btn" style="background: #e74c3c;" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </div>

  <div class="form-group">
    <label for="categorySelect" style="color: var(--gold); font-size: 16px;">📂 Select Category to Manage</label>
    <select id="categorySelect" onchange="renderItems()" style="border: 2px solid var(--gold);">
      <option value="TICKER">Scrolling Ticker (INFO)</option>
      <option value="DSA2">DSA 2</option>
      <option value="SE">Software Engg</option>
      <option value="MATH">Complex Variables</option>
      <option value="NUM">Numerical Methods</option>
      <option value="DCOM">Data Communication</option>
      <option value="IPLAB">Internet Prog. Lab</option>
      <option value="LINKS">Reference Links</option>
      <option value="COURSES">Upcoming Courses</option>
      <option value="FACULTY">Faculty List</option>
      <option value="CLASSROOM">Classroom Code</option>
      <option value="CLSROUTINE">Class Routine</option>
      <option value="HACKATHON">Upcoming Hackathon</option>
      <option value="CP">Upcoming CP</option>
      <option value="PQS">PQ Solutions</option>
      <option value="ROUTINE">Exam Routine</option>
      <option value="NOTES">Notes</option>
      <option value="SUG">Suggestions</option>
      <option value="BOOKS">Books</option>
    </select>
  </div>

  <div style="background: rgba(226,185,111,0.08); padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid rgba(226,185,111,0.3);">
    
    <div class="form-group">
      <label>Item Type</label>
      <select id="itemType">
        <option value="link">🔗 Link (PDF, YouTube, Drive, Website)</option>
        <option value="image">🖼️ Image (Direct Display)</option>
        <option value="text">📝 Plain Text (Notice / Info)</option>
        <option value="code">🔢 Passcode (Copyable Code)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Title Name </label>
      <input type="text" id="itemTitle" placeholder="Enter title to display">
    </div>

    <div class="form-group">
      <label>Content </label>
      <textarea id="itemContent" rows="3" placeholder="Paste your link here, or write your text..."></textarea>
    </div>
    
    <button class="btn" onclick="addItem()" style="width: 100%;"><i class="fa-solid fa-cloud-arrow-up"></i> Save to Database</button>
  </div>

  <h3><i class="fa-solid fa-list"></i> Current Items in Category</h3>
  <div class="item-list" id="itemList"></div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
